[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agrosim-global"
version = "1.0.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Evidence-aware crop rotation simulation and experimental validation backend"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn==1.8.0",
  "PyYAML>=6", "requests>=2.31", "pyarrow>=15", "openpyxl>=3.1", "xlrd>=2.0", "joblib>=1.3"
]

[project.optional-dependencies]
finance = ["pypdf>=6"]
boosting = ["catboost>=1.2", "xgboost>=2", "lightgbm>=4"]
geo = ["rasterio>=1.4", "h5py>=3.12", "netCDF4>=1.7", "xarray>=2024.1"]
test = ["pytest>=8"]
api = ["fastapi==0.163.1", "uvicorn==0.54.0", "pydantic==2.14.3", "starlette==1.10.0", "httpx==0.28.1"]

[project.scripts]
agrosim = "agrosim.__main__:main"
agrosim-api = "agrosim.api.__main__:main"

[tool.setuptools.packages.find]
include = ["agrosim*", "fieldshift*"]

[tool.setuptools.package-data]
"agrosim.webapp" = ["static/*"]
"agrosim.crop_catalog" = ["data/*.json"]
"agrosim.api" = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
